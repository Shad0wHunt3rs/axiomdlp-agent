syntax = "proto3";

package axiomdlp.agent.v1;

// AgentService mirrors the existing HTTP + WebSocket surface from the
// Core server. Once this compiles and links, the WebSocket transport
// can be incrementally replaced on platforms where gRPC is available.
service AgentService {
    // Enrollment (mirrors POST /api/v1/agent/register)
    rpc Register(RegisterRequest) returns (RegisterResponse);

    // Heartbeat (mirrors POST /api/v1/agent/heartbeat)
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

    // Batch content scan (mirrors POST /api/v1/agent/scan/batch)
    rpc ScanBatch(ScanBatchRequest) returns (ScanBatchResponse);

    // Bidirectional streaming channel (mirrors the WebSocket)
    rpc Connect(stream AgentMessage) returns (stream ServerMessage);
}

message RegisterRequest {
    string hostname      = 1;
    string os            = 2;
    string agent_version = 3;
}

message RegisterResponse {
    int32 agent_id        = 1;
    int32 user_id         = 2;
    int32 organization_id = 3;
}

message HeartbeatRequest {
    int32  agent_id      = 1;
    string agent_version = 2;
}

message HeartbeatResponse {
    bool  ok               = 1;
    int64 server_time_unix = 2;
}

message Chunk {
    string file_hash   = 1;
    string path        = 2;
    uint32 chunk_index = 3;
    uint32 chunk_count = 4;
    bytes  content     = 5;
}

message ScanBatchRequest {
    repeated Chunk chunks = 1;
}

message ScanResult {
    string file_hash   = 1;
    bool   sensitive   = 2;
    string entity_type = 3;
    string error       = 4;
}

message ScanBatchResponse {
    repeated ScanResult results = 1;
}

// Bidirectional stream payloads

message AgentMessage {
    oneof payload {
        HeartbeatPing heartbeat_ping = 1;
        AgentShutdown agent_shutdown = 2;
        SensitiveFile sensitive_file = 3;
    }
}

message HeartbeatPing {
    int64 ts_unix = 1;
}

message AgentShutdown {
    string reason   = 1;
    int32  agent_id = 2;
}

message SensitiveFile {
    string path     = 1;
    string category = 2;
    uint64 size     = 3;
}

message ServerMessage {
    oneof payload {
        HeartbeatAck heartbeat_ack = 1;
        PolicyUpdate policy_update = 2;
        Command      command       = 3;
        TokenRevoked token_revoked = 4;
        AgentRevoked agent_revoked = 5;
    }
}

message HeartbeatAck {
    int64 ts_unix = 1;
}

message PolicyUpdate {
    int64 version    = 1;
    bytes bundle_url = 2;
}

message Command {
    string action       = 1;
    string payload_json = 2;
}

message TokenRevoked {
    string reason = 1;
}

message AgentRevoked {
    string reason = 1;
}
