name: Windows MSVC build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify custom triplets exist
        run: |
          if (-not (Test-Path "triplets\x64-windows-static.cmake")) { throw "ERROR: Missing triplets\x64-windows-static.cmake" }
          if (-not (Test-Path "triplets\x86-windows-static.cmake")) { throw "ERROR: Missing triplets\x86-windows-static.cmake" }
          Write-Host "[OK] Custom triplets found."
        shell: powershell

      - name: Install Ninja
        run: choco install ninja -y

      - name: Add Chocolatey bin to PATH
        run: echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
        shell: powershell

      - name: Verify Ninja is reachable
        run: |
          where.exe ninja
          ninja --version
        shell: powershell

      - name: Cache vcpkg downloads and binary archives
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\vcpkg\downloads
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}-${{ hashFiles('**/triplets/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Setup MSVC and vcpkg
        run: .\scripts\win\setup-windows-msvc.ps1
        shell: powershell

      # ------------------------------------------------------------------
      # Post-setup sanity checks
      #
      # GITHUB_PATH and the .NET SetEnvironmentVariable("User") API both
      # persist to the *next* process, not to this one. Before the fix,
      # the very next step ran build-windows-msvc.ps1, which invoked
      # vcvarsall.bat — and that rewrote %PATH%, hiding the system ninja
      # from vcpkg and CMake. These explicit checks fail fast and loudly
      # if either tool is missing on PATH after env setup, so the error
      # appears here instead of deep inside vcpkg's configure log.
      # ------------------------------------------------------------------
      - name: Verify Ninja + VCPKG_ROOT after setup
        run: |
          Write-Host "--- PATH ---"
          $env:PATH -split ';' | ForEach-Object { Write-Host $_ }

          Write-Host "--- where ninja ---"
          where.exe ninja
          if ($LASTEXITCODE -ne 0) {
              throw "ninja not found on PATH after setup. GITHUB_PATH propagation is broken."
          }

          Write-Host "--- ninja --version ---"
          ninja --version

          Write-Host "--- VCPKG_ROOT ---"
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          if (-not $env:VCPKG_ROOT) {
              throw "VCPKG_ROOT is not set after setup."
          }
          if (-not (Test-Path "$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake")) {
              throw "vcpkg toolchain file missing at $env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          }
        shell: powershell

      - name: Build x64 Release
        run: .\scripts\win\build-windows-msvc.ps1 -Arch x64
        shell: powershell
        env:
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\triplets
          # NOTE: VCPKG_FORCE_SYSTEM_BINARIES was removed. Setting it to 1
          # made vcpkg refuse to download its own ninja when find_program
          # failed — and find_program failed because vcvarsall.bat inside
          # build-windows-msvc.ps1 rewrote PATH, hiding the chocolatey ninja.
          # The script now preserves PATH across vcvarsall.bat, so system
          # ninja is visible to vcpkg; and even if it weren't, vcpkg is
          # allowed to fetch its own copy now.

      - name: Build x86 Release
        run: .\scripts\win\build-windows-msvc.ps1 -Arch x86
        shell: powershell
        env:
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\triplets

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axiomdlp-agent-windows-binaries
          path: |
            build/windows-x64-msvc-release/axiomdlp-agent.exe
            build/windows-x86-msvc-release/axiomdlp-agent.exe