name: Windows MSVC build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify custom triplets exist
        run: |
          if (-not (Test-Path "triplets\x64-windows-static.cmake")) { throw "ERROR: Missing triplets\x64-windows-static.cmake" }
          if (-not (Test-Path "triplets\x86-windows-static.cmake")) { throw "ERROR: Missing triplets\x86-windows-static.cmake" }
          Write-Host "[OK] Custom triplets found."
        shell: powershell

      - name: Install Ninja
        run: choco install ninja -y

      - name: Add Chocolatey bin to PATH
        run: echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
        shell: powershell

      # ----------------------------------------------------------------
      # Remove Strawberry's ninja from PATH.
      #
      # The windows-latest runner image ships a ninja at
      # C:\Strawberry\c\bin\ninja.exe. It sits on PATH by default, and
      # its version does not match what vcpkg expects. If vcpkg sees
      # it first, vcpkg's find_program(NINJA) returns the wrong one,
      # the version check fails, and vcpkg falls into its (buggy)
      # download-and-verify path which runs "ninja -v" (verbose build,
      # fails with exit 1 in an empty directory) instead of
      # "ninja --version".
      #
      # Removing Strawberry's entry means the only ninja vcpkg can
      # find is the one chocolatey installed, at the correct version.
      # ----------------------------------------------------------------
      - name: Remove Strawberry ninja from PATH
        run: |
          $originalPath = $env:PATH
          $filtered = ($originalPath -split ';' | Where-Object { $_ -notlike '*Strawberry*' }) -join ';'
          if ($filtered -ne $originalPath) {
              Write-Host "Removed Strawberry entries from PATH"
          } else {
              Write-Host "No Strawberry entries found (already clean)"
          }
          $env:PATH = $filtered
          # Persist for subsequent steps
          "PATH=$filtered" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "--- where.exe ninja after cleanup ---"
          where.exe ninja
          if ($LASTEXITCODE -ne 0) {
              throw "ninja not found on PATH after Strawberry cleanup"
          }
          $count = (where.exe ninja | Measure-Object).Count
          if ($count -ne 1) {
              throw "Expected exactly 1 ninja on PATH, found $count. Refusing to continue with ambiguous ninja resolution."
          }
          Write-Host "--- ninja --version ---"
          ninja --version
        shell: powershell

      - name: Cache vcpkg downloads and binary archives
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\vcpkg\downloads
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}-${{ hashFiles('**/triplets/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Setup MSVC and vcpkg
        run: .\scripts\win\setup-windows-msvc.ps1
        shell: powershell

      - name: Verify Ninja + VCPKG_ROOT after setup
        run: |
          Write-Host "--- PATH (first 5 entries) ---"
          $env:PATH -split ';' | Select-Object -First 5 | ForEach-Object { Write-Host $_ }

          Write-Host "--- where ninja ---"
          where.exe ninja
          if ($LASTEXITCODE -ne 0) {
              throw "ninja not found on PATH after setup. GITHUB_PATH propagation is broken."
          }

          Write-Host "--- ninja --version ---"
          ninja --version

          Write-Host "--- VCPKG_ROOT ---"
          $effectiveVcpkgRoot = $env:VCPKG_ROOT
          if (-not $effectiveVcpkgRoot) {
              $effectiveVcpkgRoot = [System.Environment]::GetEnvironmentVariable("VCPKG_ROOT", "User")
              if ($effectiveVcpkgRoot) {
                  Write-Host "  (fallback: read from User-scope registry)"
                  $env:VCPKG_ROOT = $effectiveVcpkgRoot
              }
          }
          Write-Host "VCPKG_ROOT=$effectiveVcpkgRoot"
          if (-not $effectiveVcpkgRoot) {
              throw "VCPKG_ROOT is not set after setup (checked process env + User-scope registry)."
          }
          if (-not (Test-Path "$effectiveVcpkgRoot\scripts\buildsystems\vcpkg.cmake")) {
              throw "vcpkg toolchain file missing at $effectiveVcpkgRoot\scripts\buildsystems\vcpkg.cmake"
          }
        shell: powershell

      - name: Build x64 Release
        run: .\scripts\win\build-windows-msvc.ps1 -Arch x64
        shell: powershell
        env:
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\triplets
          # Force vcpkg to use the system ninja instead of downloading its
          # own. Without this, vcpkg on this baseline falls into a buggy
          # download-and-verify path that invokes "ninja -v" (verbose
          # build, exit 1 in an empty directory) instead of
          # "ninja --version", and the build dies during compiler
          # detection. With the flag set and system ninja on PATH (the
          # steps above guarantee both), vcpkg uses the working ninja.
          VCPKG_FORCE_SYSTEM_BINARIES: 1

      - name: Build x86 Release
        run: .\scripts\win\build-windows-msvc.ps1 -Arch x86
        shell: powershell
        env:
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\triplets
          VCPKG_FORCE_SYSTEM_BINARIES: 1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axiomdlp-agent-windows-binaries
          path: |
            build/windows-x64-msvc-release/axiomdlp-agent.exe
            build/windows-x86-msvc-release/axiomdlp-agent.exe