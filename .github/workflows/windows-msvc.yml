name: Windows MSVC build

on:
  push:
    branches: [msvc-windows-build, main]
  pull_request:
    branches: [msvc-windows-build, main]
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg-cache,readwrite"

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.arch }}-

      - name: Clone vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-${{ matrix.arch }}-msvc-release

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-${{ matrix.arch }}-msvc-release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: axiomdlp-agent-windows-${{ matrix.arch }}-release
          path: build/windows-${{ matrix.arch }}-msvc-release/axiomdlp-agent.exe
          if-no-files-found: error
